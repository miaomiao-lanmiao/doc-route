name: Bug report / 缺陷反馈
description: Report a reproducible problem using sanitized data.
title: 'bug: '
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js, and Doc Route versions or commit ID.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Command and minimal reproduction
      description: Use a small synthetic Markdown example; remove private paths.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and workflow impact
    validations:
      required: true

